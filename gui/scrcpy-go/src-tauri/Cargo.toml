[package]
name = "scrcpy-go"
version = "0.1.0"
description = "Gaming-optimized launcher for scrcpy-gaming"
authors = ["scrcpy-gaming contributors"]
edition = "2021"

[lib]
name = "scrcpy_go_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["process", "time"] }
