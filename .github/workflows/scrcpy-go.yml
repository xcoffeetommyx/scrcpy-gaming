name: Scrcpy GO desktop packages

on:
  push:
    branches: [codex/linux-desktop-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gui/scrcpy-go/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file patchelf pkg-config \
            libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev \
            meson ninja-build nasm ffmpeg libavcodec-dev libavdevice-dev libavformat-dev \
            libavutil-dev libswresample-dev libusb-1.0-0-dev libv4l-dev \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libthai-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev \
            xvfb dbus-x11 desktop-file-utils
      - name: Build the Android server
        run: |
          chmod +x gradlew
          ./gradlew -p server assembleRelease
      - uses: actions/cache@v4
        with:
          path: app/deps/work
          key: linux-backend-${{ runner.os }}-${{ hashFiles('app/deps/**.sh', 'app/deps/_init', 'app/deps/patches/**') }}
      - name: Build the bundled Linux client
        run: |
          release/build_linux.sh x86_64
          cp server/build/outputs/apk/release/server-release-unsigned.apk release/work/build-linux-x86_64/dist/scrcpy-server
          bash gui/scrcpy-go/scripts/bundle-linux-libraries.sh
          release/work/build-linux-x86_64/dist/scrcpy --help | grep -- --fullscreen-exclusive
          release/work/build-linux-x86_64/dist/adb version
      - name: Install frontend dependencies and test
        working-directory: gui/scrcpy-go
        run: |
          npm ci
          npm test
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Package the graphical Linux app
        working-directory: gui/scrcpy-go
        run: npm run tauri build -- --bundles deb,appimage
      - name: Verify package contents and launch
        run: |
          bash gui/scrcpy-go/scripts/check-linux-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Scrcpy-GO-linux-x86_64
          path: |
            gui/scrcpy-go/src-tauri/target/release/bundle/deb/*.deb
            gui/scrcpy-go/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
